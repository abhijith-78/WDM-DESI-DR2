theory:
  camb:
    path: /home/abhijith18/COCOA/cocoa/Cocoa/external_modules/code/CAMB
    extra_args:
      halofit_version: mead
      AccuracyBoost: 1.1
      num_massive_neutrinos: 1
      nnu: 3.044
      accurate_massive_neutrino_transfers: false
      k_per_logint: 20
      lens_potential_accuracy: 1.0
likelihood:
  bao.desi_dr2:
    path: /home/abhijith18/COCOA/cocoa/Cocoa/external_modules/data/
  des_y3.des_3x2pt:
    path: /home/abhijith18/COCOA/cocoa/Cocoa/external_modules/data/des_y3
    data_file: des_y3_real.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    kmax_boltzmann: 5.0
    non_linear_emul: 2
    IA_model: 1
    IA_redshift_evolution: 3
params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 20
      max: 100
    ref:
      dist: norm
      loc: 67
      scale: 2
    proposal: 2
    latex: H_0
  wdm:
    prior:
      min: -0.1
      max: 0.1
    ref:
      dist: norm
      loc: -0.01
      scale: 0.005
    latex: w_{dm}
  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  omegam:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  mnu: 0.06
  omega_de:
    latex: \Omega_\Lambda
  YHe:
    latex: Y_\mathrm{P}
  Y_p:
    latex: Y_P^\mathrm{BBN}
  DHBBN:
    derived: 'lambda DH: 10**5*DH'
    latex: 10^5 \mathrm{D}/\mathrm{H}
  tau:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  zrei:
    latex: z_\mathrm{re}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam)**(0.5)*(0.30)**(-0.5)'
    latex: S_8
sampler:
  mcmc:
    covmat: w0wa_DES+DESI2+Union.covmat
    learn_every: 20d
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    Rminus1_stop: 0.05
    Rminus1_cl_stop: 0.2
output: wdm_des3x2_desi2
